<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Qulf ekrani' if lang == 'uz' else ('Қулф экрани' if lang == 'uz_cyrl' else 'Экран блокировки') }}</title>
    <style>
        :root {
            --accent: #38d39f;
            --error: #ff6b6b;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f3f6ff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #lockScreen {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Foydalanuvchi tanlagan orqa fon rasm bo'lsa qo'llash */
        {% if current_lock_bg %}
        #lockScreen { background-image: url('{{ current_lock_bg }}'); }
        {% elif current_user_bg %}
        #lockScreen { background-image: url('{{ current_user_bg }}'); }
        {% endif %}

        .lock-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 1;
        }

        .lock-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: var(--text);
            width: 90%;
            max-width: 380px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            margin: 0 0 8px;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        #lockSub {
            color: rgba(243, 246, 255, 0.6);
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* 🛡️ PIN O'rnatish (Setup) maydonlari */
        .setup-container {
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .setup-container input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 14px;
            border-radius: 14px;
            color: white;
            outline: none;
            font-size: 15px;
            transition: all 0.2s;
            text-align: center;
        }

        .setup-container input:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 15px rgba(56, 211, 159, 0.2);
        }

        .dots-container {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin: 25px 0;
        }

        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            background: transparent;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .dot.filled {
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
            transform: scale(1.1);
        }

        .dot.error {
            border-color: var(--error);
            background: var(--error);
            box-shadow: 0 0 15px var(--error);
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 75px);
            gap: 18px 25px;
            justify-content: center;
            margin-top: 10px;
        }

        .key {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 30px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .key:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.9);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .key.icon-key {
            background: transparent;
            border: none;
            color: var(--accent);
        }

        .key.delete-key {
            color: var(--error);
        }

        .footer-links {
            margin-top: 30px;
        }

        .btn-link {
            background: none;
            border: none;
            color: #6cb2ff;
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
            opacity: 0.8;
        }

        .btn-link:hover { opacity: 1; }

        @media (max-height: 700px) {
            .keypad { gap: 10px 20px; }
            .key { width: 65px; height: 65px; font-size: 26px; }
            h2 { font-size: 22px; }
        }
    </style>
</head>
<body>

<div id="lockScreen">
    <div class="lock-overlay"></div>
    <div class="lock-content">
        <h2 id="lockTitle">...</h2>
        <p id="lockSub"></p>

        <div id="setupContainer" class="setup-container">
            <input type="email" id="emailInput" placeholder="Elektron pochta (tiklash uchun)" autocomplete="off">
            <input type="text" id="secretWordInput" placeholder="Maxfiy so'z (masalan: onamni ismi)" autocomplete="off">
        </div>

        <div class="dots-container" id="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="keypad">
            <div class="key" onclick="pressKey('1')">1</div>
            <div class="key" onclick="pressKey('2')">2</div>
            <div class="key" onclick="pressKey('3')">3</div>
            <div class="key" onclick="pressKey('4')">4</div>
            <div class="key" onclick="pressKey('5')">5</div>
            <div class="key" onclick="pressKey('6')">6</div>
            <div class="key" onclick="pressKey('7')">7</div>
            <div class="key" onclick="pressKey('8')">8</div>
            <div class="key" onclick="pressKey('9')">9</div>

            <div class="key icon-key" id="bioKey" onclick="loginWithBiometrics()" style="visibility:hidden;">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2a10 10 0 0 0-10 10c0 5.523 4.477 10 10 10s10-4.477 10-10A10 10 0 0 0 12 2z"></path>
                  <path d="M12 6a6 6 0 0 0-6 6"></path><path d="M12 10a2 2 0 0 0-2 2"></path>
                  <path d="M12 14a2 2 0 0 0 2-2"></path><path d="M12 18a6 6 0 0 0 6-6"></path>
                </svg>
            </div>

            <div class="key" onclick="pressKey('0')">0</div>

            <div class="key icon-key delete-key" onclick="deleteKey()">
                <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                  <line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line>
                </svg>
            </div>
        </div>

        <div class="footer-links" id="footerLinks" style="display:none;">
            <button class="btn-link" onclick="forgotPin()">
                ❓ {{ 'PIN kodni unutdingizmi?' if lang == 'uz' else 'PIN кодни унутдингизми?' }}
            </button>
        </div>
    </div>
</div>

<script>
    const lang = "{{ lang }}";
    const token = new URLSearchParams(window.location.search).get("token") || "{{ token }}";

    let currentPin = "";
    let setupMode = false;
    let tempPin = "";
    let step = 1;

    // 1. Dastlabki holatni tekshirish
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const response = await fetch('/api/pin-manager', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ action: 'check', token: token })
            });
            const data = await response.json();

            if (data.success) {
                if (!data.has_pin) {
                    setupMode = true;
                    document.getElementById('setupContainer').style.display = 'flex';
                    updateUI("Yangi PIN o'rnating", "4 xonali kod, email va maxfiy so'zni kiriting");
                } else {
                    document.getElementById('footerLinks').style.display = 'block';
                    updateUI("PIN kodni kiriting", "Tizimga kirish uchun shaxsiy kodingizni tering");

                    // Biometrika tekshiruvi (Local storage orqali)
                    if (localStorage.getItem('biometric_' + token) === 'true') {
                        document.getElementById('bioKey').style.visibility = 'visible';
                        setTimeout(loginWithBiometrics, 500);
                    }
                }
            }
        } catch (e) {
            updateUI("Xatolik", "Server bilan aloqa uzildi. Iltimos, sahifani yangilang.");
        }
    });

    function updateUI(title, sub) {
        document.getElementById('lockTitle').innerText = title;
        document.getElementById('lockSub').innerText = sub;
    }

    function pressKey(num) {
        if (currentPin.length < 4) {
            currentPin += num;
            updateDots();
            if (currentPin.length === 4) {
                setTimeout(handleCompletePin, 150);
            }
        }
    }

    function deleteKey() {
        if (currentPin.length > 0) {
            currentPin = currentPin.slice(0, -1);
            updateDots();
        }
    }

    function updateDots() {
        const dots = document.querySelectorAll('.dot');
        dots.forEach((dot, index) => {
            if (index < currentPin.length) {
                dot.classList.add('filled');
            } else {
                dot.classList.remove('filled');
            }
            dot.classList.remove('error');
        });
    }

    function showErrorAnimation() {
        const dots = document.querySelectorAll('.dot');
        dots.forEach(dot => dot.classList.add('error'));
        setTimeout(() => {
            currentPin = "";
            updateDots();
        }, 500);
    }

    // 2. PIN kiritib bo'lingandagi asosiy mantiq
    async function handleCompletePin() {
        if (setupMode) {
            if (step === 1) {
                const email = document.getElementById('emailInput').value.trim();
                const secret = document.getElementById('secretWordInput').value.trim();

                if (!email.includes('@') || secret.length < 2) {
                    alert("Iltimos, Email va Maxfiy so'zni to'g'ri to'ldiring!");
                    currentPin = "";
                    updateDots();
                    return;
                }

                tempPin = currentPin;
                currentPin = "";
                step = 2;
                updateUI("Tasdiqlang", "PIN kodni tasdiqlash uchun qayta kiriting");
                updateDots();
            } else {
                if (currentPin === tempPin) {
                    submitPin('set');
                } else {
                    alert("PIN kodlar mos kelmadi! Qaytadan urinib ko'ring.");
                    step = 1;
                    tempPin = "";
                    showErrorAnimation();
                    updateUI("Yangi PIN o'rnating", "Xavfsizlik uchun 4 xonali kodni kiriting");
                }
            }
        } else {
            submitPin('verify');
        }
    }

    // 3. Serverga so'rov yuborish
    async function submitPin(actionType) {
        const payload = {
            action: actionType,
            token: token,
            pin: currentPin
        };

        if (actionType === 'set') {
            payload.email = document.getElementById('emailInput').value.trim();
            payload.secret_word = document.getElementById('secretWordInput').value.trim();
        }

        try {
            const res = await fetch('/api/pin-manager', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (data.success) {
                // next_url bo'lsa o'sha sahifaga, bo'lmasa bosh sahifaga
                const dest = data.next_url
                    ? `${data.next_url}${data.next_url.includes('?') ? '&' : '?'}token=${token}`
                    : `/?token=${token}`;
                window.location.href = dest;
            } else {
                alert(data.error || "Xato!");
                showErrorAnimation();
            }
        } catch (e) {
            alert("Aloqa xatosi! Server javob bermadi.");
            showErrorAnimation();
        }
    }

    // 4. BIOMETRIKA ORQALI KIRISH (Haqiqiy API)
    async function loginWithBiometrics() {
        if (!window.PublicKeyCredential || localStorage.getItem('biometric_' + token) !== 'true') return;
        try {
            const challenge = new Uint8Array(32);
            window.crypto.getRandomValues(challenge);

            const assertion = await navigator.credentials.get({
                publicKey: {
                    challenge: challenge,
                    rpId: window.location.hostname,
                    userVerification: "required",
                    timeout: 60000
                }
            });

            if (assertion) {
                // 🟢 YANGILIK: Pythonga barmoq tasdiqlanganini xabar beramiz
                const res = await fetch('/api/pin-manager', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ action: 'biometric_unlock', token: token })
                });
                const data = await res.json();

                if (data.success) {
                    if (typeof unlockMainScreen === "function") {
                        unlockMainScreen();
                    } else {
                        const dest = data.next_url
                            ? `${data.next_url}${data.next_url.includes('?') ? '&' : '?'}token=${token}`
                            : `/?token=${token}`;
                        window.location.href = dest;
                    }
                }
            }
        } catch (err) {
            console.log("Biometrika xatosi", err);
            // Ekranda qizil xatolik chiqarish
            if (typeof showErrorAnimation === "function") showErrorAnimation();
            else if (typeof showMainError === "function") showMainError();
        }
    }

    // 5. UNUTILGAN PIN TIKLASH FUNKSIYASI (To'g'rilangan)
    async function forgotPin() {
        let choice = confirm("PIN kodni tiklash uchun pochtangizga kod yuboramizmi?\n\nOK - Pochtaga kod yuborish\nCancel (Bekor qilish) - Maxfiy so'z orqali tiklash");

        if (choice) {
            try {
                updateUI("Kuting...", "Pochtaga kod yuborilmoqda");

                const res = await fetch('/api/request-pin-reset', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ token: token })
                });
                const data = await res.json();

                if (data.success) {
                    let code = prompt(`${data.email} pochtasiga 4 xonali kod yuborildi.\nShu kodni kiriting:`);
                    if (code) {
                        verifyResetData({ token: token, code: code });
                    } else {
                        updateUI("PIN kodni kiriting", "Tizimga kirish uchun shaxsiy kodingizni tering");
                    }
                } else {
                    alert("Xatolik: " + data.error);
                    updateUI("PIN kodni kiriting", "Tizimga kirish uchun shaxsiy kodingizni tering");
                }
            } catch (e) {
                alert("Server xatosi: Aloqa uzildi!");
                updateUI("PIN kodni kiriting", "Tizimga kirish uchun shaxsiy kodingizni tering");
            }
        } else {
            let secret = prompt("Akkaunt xavfsizligi uchun o'rnatgan Maxfiy so'zingizni kiriting:\n(Masalan: onamni ismi yoki itimni ismi)");
            if (secret) {
                verifyResetData({ token: token, secret_word: secret });
            }
        }
    }

    // 6. TIKLASH MA'LUMOTLARINI SERVERGA JO'NATISH
    async function verifyResetData(payload) {
        try {
            const res = await fetch('/api/verify-pin-reset', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (data.success) {
                alert("✅ Muvaffaqiyatli!\nEski PIN kod o'chirildi. Endi tizimga yangi PIN kod o'rnatishingiz mumkin.");
                window.location.reload();
            } else {
                alert("❌ Xato: " + data.error);
                updateUI("PIN kodni kiriting", "Tizimga kirish uchun shaxsiy kodingizni tering");
            }
        } catch (e) {
            alert("Server xatosi yuz berdi!");
        }
    }
</script>

<script>
/**
 * ============================================================
 *  TESTCHI — GLOBAL ANIMATION SYSTEM  v2.0
 *  Mualliflar: Kiro AI
 *  Vazifasi:
 *    1. Qurilma kuchlanishini o'lchash (Performance Detection)
 *    2. Sahifaga kirish / chiqish animatsiyalari (Page Transitions)
 *    3. Barcha tugmalar uchun Ripple effekt
 *    4. Toast xabarnomalar (alert() ni almashtirish)
 *    5. Kartalar paydo bo'lish animatsiyasi (Intersection Observer)
 *    6. Navbarning silliq scroll effekti
 * ============================================================
 */

(function () {
  'use strict';

  /* ─────────────────────────────────────────────
     1. PERFORMANCE DETECTION
     GPU / CPU kuchini o'lchab, agar zaif bo'lsa
     barcha animatsiyalarni o'chiradi.
  ─────────────────────────────────────────────── */
  const PERF_KEY = 'testchi_perf';
  let animEnabled = true;

  function detectPerformance() {
    const saved = localStorage.getItem(PERF_KEY);
    if (saved !== null) {
      animEnabled = saved === '1';
      applyPerfMode();
      return;
    }

    // Navigator.hardwareConcurrency — CPU yadrolar soni
    const cores = navigator.hardwareConcurrency || 2;
    // deviceMemory (GB) — faqat Chrome-da mavjud
    const mem = navigator.deviceMemory || 4;

    // Zaif qurilma hisoblash: 2 yoki kam yadro, 2GB yoki kam RAM
    if (cores <= 2 || mem <= 2) {
      animEnabled = false;
      localStorage.setItem(PERF_KEY, '0');
    } else {
      // FPS testi: 300ms ichida framelar soni
      let frames = 0;
      const start = performance.now();
      function countFrame() {
        frames++;
        if (performance.now() - start < 300) {
          requestAnimationFrame(countFrame);
        } else {
          const fps = Math.round(frames / 0.3);
          animEnabled = fps >= 30;
          localStorage.setItem(PERF_KEY, animEnabled ? '1' : '0');
          applyPerfMode();
        }
      }
      requestAnimationFrame(countFrame);
    }
    applyPerfMode();
  }

  function applyPerfMode() {
    if (!animEnabled) {
      document.documentElement.classList.add('no-anim');
    } else {
      document.documentElement.classList.remove('no-anim');
    }
  }

  /* ─────────────────────────────────────────────
     2. GLOBAL CSS INJECTION
     Animatsiya CSS-larini head-ga qo'shadi.
  ─────────────────────────────────────────────── */
  function injectStyles() {
    if (document.getElementById('testchi-anim-style')) return;

    const style = document.createElement('style');
    style.id = 'testchi-anim-style';
    style.textContent = `
      /* ── PERFORMANCE OFF ── */
      html.no-anim *, html.no-anim *::before, html.no-anim *::after {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
      }

      /* ── PAGE TRANSITION ── */
      #page-transition-overlay {
        position: fixed; inset: 0; z-index: 99999;
        background: radial-gradient(circle at center, #0d1528 0%, #050810 100%);
        display: flex; align-items: center; justify-content: center;
        pointer-events: none; opacity: 0;
        transition: opacity 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #page-transition-overlay.active { opacity: 1; pointer-events: all; }
      #page-transition-overlay .logo-spin {
        font-size: 36px;
        animation: ptSpin 0.6s ease-in-out infinite alternate;
      }
      @keyframes ptSpin {
        0%   { transform: scale(0.8) rotate(-8deg); opacity: 0.6; }
        100% { transform: scale(1.2) rotate(8deg);  opacity: 1;   }
      }

      /* ── BODY ENTER ── */
      body { animation: bodyFadeIn 0.35s ease both; }
      @keyframes bodyFadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0);    }
      }

      /* ── RIPPLE ── */
      .ripple-host { position: relative; overflow: hidden; }
      .ripple-wave {
        position: absolute; border-radius: 50%;
        background: rgba(255, 255, 255, 0.22);
        transform: scale(0); pointer-events: none;
        animation: rippleAnim 0.55s ease-out forwards;
      }
      @keyframes rippleAnim {
        to { transform: scale(4); opacity: 0; }
      }

      /* ── CARD APPEAR ── */
      .anim-card {
        opacity: 0;
        transform: translateY(22px) scale(0.97);
        transition: opacity 0.42s cubic-bezier(0.22, 1, 0.36, 1),
                    transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .anim-card.visible {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      /* ── HOVER LIFT (nav-links a, btn, .card.test-card) ── */
      nav a, .btn, .test-card, .card, button:not(.no-lift) {
        transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
                    box-shadow 0.18s ease,
                    background 0.18s ease,
                    border-color 0.18s ease !important;
      }
      nav a:hover    { transform: translateY(-2px) scale(1.03) !important; }
      .test-card:hover {
        transform: translateY(-5px) scale(1.025) !important;
        box-shadow: 0 18px 50px rgba(0,0,0,0.45) !important;
      }
      .btn:hover:not(:disabled) {
        transform: translateY(-2px) scale(1.02) !important;
        box-shadow: 0 8px 24px rgba(0,0,0,0.3) !important;
      }
      button:not(.no-lift):hover:not(:disabled) {
        transform: translateY(-1px) !important;
      }
      .key:active {
        transform: scale(0.88) !important;
        transition-duration: 0.08s !important;
      }

      /* ── TOAST ── */
      #toast-container {
        position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
        z-index: 99990; display: flex; flex-direction: column-reverse;
        align-items: center; gap: 10px; pointer-events: none;
      }
      .toast {
        background: rgba(22, 32, 56, 0.96);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(255,255,255,0.13);
        color: #f3f6ff; border-radius: 16px;
        padding: 13px 22px; font-size: 14px; font-weight: 500;
        box-shadow: 0 12px 36px rgba(0,0,0,0.45);
        display: flex; align-items: center; gap: 10px;
        animation: toastIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        max-width: 90vw; pointer-events: all;
        white-space: pre-wrap;
      }
      .toast.hide { animation: toastOut 0.3s ease forwards; }
      .toast.success { border-left: 3px solid #38d39f; }
      .toast.error   { border-left: 3px solid #ff6b6b; }
      .toast.info    { border-left: 3px solid #6cb2ff; }
      .toast.warning { border-left: 3px solid #fbbf24; }
      @keyframes toastIn {
        from { opacity: 0; transform: translateY(20px) scale(0.93); }
        to   { opacity: 1; transform: translateY(0)    scale(1);    }
      }
      @keyframes toastOut {
        to   { opacity: 0; transform: translateY(14px) scale(0.9); }
      }

      /* ── MODAL OPEN ── */
      .modal[style*="flex"], .modal[style*="block"] {
        animation: modalIn 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      }
      @keyframes modalIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      .modal-content, .modal .modal-content {
        animation: modalSlide 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes modalSlide {
        from { transform: scale(0.92) translateY(18px); opacity: 0; }
        to   { transform: scale(1)    translateY(0);    opacity: 1; }
      }

      /* ── SPINNER (yuklanayotganda) ── */
      .btn.loading::after {
        content: '';
        display: inline-block;
        width: 14px; height: 14px;
        border: 2px solid rgba(255,255,255,0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        margin-left: 8px;
        vertical-align: middle;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ── DOT PULSE (PIN ekranda) ── */
      .dot.filled {
        animation: dotPulse 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
      }
      @keyframes dotPulse {
        0%   { transform: scale(0.6); }
        60%  { transform: scale(1.25); }
        100% { transform: scale(1.1); }
      }

      /* ── OPTION SELECT (solve_test) ── */
      .option-label {
        transition: background 0.18s ease, border-color 0.18s ease,
                    transform 0.18s cubic-bezier(0.34,1.56,0.64,1),
                    box-shadow 0.18s ease !important;
      }
      .option-label:hover {
        transform: translateX(4px) !important;
      }
      .option-label.selected {
        transform: translateX(4px) scale(1.01) !important;
      }

      /* ── PROGRESS BAR ── */
      .progress-bar-fill {
        transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1) !important;
      }

      /* ── QUESTION CARD SLIDE ── */
      #questionCard.slide-in {
        animation: slideIn 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #questionCard.slide-out {
        animation: slideOut 0.2s ease-in both;
      }
      @keyframes slideIn {
        from { opacity: 0; transform: translateX(30px); }
        to   { opacity: 1; transform: translateX(0);    }
      }
      @keyframes slideOut {
        from { opacity: 1; transform: translateX(0);     }
        to   { opacity: 0; transform: translateX(-30px); }
      }

      /* ── SCORE CIRCLE COUNT UP ── */
      .score-circle {
        animation: scoreAppear 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes scoreAppear {
        from { transform: scale(0.4); opacity: 0; }
        to   { transform: scale(1);   opacity: 1; }
      }

      /* ── NAVBAR SCROLL HIDE ── */
      nav.nav-hidden {
        transform: translateY(-100%) !important;
        transition: transform 0.3s ease !important;
      }
      nav {
        transition: transform 0.3s ease !important;
      }

      /* ── HERO TEXT ── */
      .hero h2, main > h2, .hero > h2 {
        animation: heroTitle 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        animation-delay: 0.05s;
      }
      @keyframes heroTitle {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0);    }
      }

      /* ── SESSION ITEM (ai_chat) ── */
      .session-item {
        transition: background 0.18s ease, color 0.18s ease,
                    transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
      }
      .session-item:hover { transform: translateX(4px) !important; }

      /* ── BADGE PULSE (bildirishnomalar) ── */
      @keyframes badgePulse {
        0%,100% { transform: scale(1); }
        50%      { transform: scale(1.2); }
      }
    `;
    document.head.appendChild(style);
  }

  /* ─────────────────────────────────────────────
     3. PAGE TRANSITION OVERLAY
  ─────────────────────────────────────────────── */
  function setupPageTransitions() {
    if (!animEnabled) return;

    // Overlay yaratish
    let overlay = document.getElementById('page-transition-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'page-transition-overlay';
      overlay.innerHTML = '<span class="logo-spin">🎓</span>';
      document.body.appendChild(overlay);
    }

    // Barcha ichki havolalarni ushlash
    document.addEventListener('click', function (e) {
      const link = e.target.closest('a');
      if (!link) return;

      const href = link.getAttribute('href');
      if (!href) return;

      // Tashqi, anchor, javascript: havolalarni o'tkazib yuborish
      if (
        href.startsWith('http') ||
        href.startsWith('#') ||
        href.startsWith('javascript') ||
        href.startsWith('mailto') ||
        link.target === '_blank' ||
        e.ctrlKey || e.metaKey || e.shiftKey
      ) return;

      // Form ichidagi submit linklar
      if (link.closest('form')) return;

      e.preventDefault();
      overlay.classList.add('active');

      setTimeout(() => {
        window.location.href = href;
      }, 280);
    });

    // Form submitlarda ham overlay
    document.addEventListener('submit', function (e) {
      const form = e.target;
      if (form.method && form.method.toLowerCase() !== 'get') {
        // POST formlar serverga ketadi, overlay kerak emas
        // GET formlar uchun (qidiruv kabi) qisqa overlay
        if (form.method.toLowerCase() === 'get') {
          overlay.classList.add('active');
        }
      }
    });
  }

  /* ─────────────────────────────────────────────
     4. RIPPLE EFFECT
     Har bir bosuvchi elementga ripple qo'shadi.
  ─────────────────────────────────────────────── */
  function setupRipple() {
    const SELECTORS = 'a, button, .btn, .card.test-card, .key, .option-label, .star-option, .tab, .session-item, .list > li, .user-card, .new-chat-btn';

    function addRipple(el, x, y) {
      if (!animEnabled) return;
      el.classList.add('ripple-host');
      const rect = el.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height) * 2;
      const wave = document.createElement('span');
      wave.className = 'ripple-wave';
      wave.style.cssText = `
        width: ${size}px; height: ${size}px;
        left: ${x - rect.left - size / 2}px;
        top:  ${y - rect.top  - size / 2}px;
      `;
      el.appendChild(wave);
      wave.addEventListener('animationend', () => wave.remove(), { once: true });
    }

    document.addEventListener('pointerdown', function (e) {
      const el = e.target.closest(SELECTORS);
      if (el) addRipple(el, e.clientX, e.clientY);
    });
  }

  /* ─────────────────────────────────────────────
     5. TOAST NOTIFICATION SYSTEM
     alert() ni to'liq almashtiradi.
  ─────────────────────────────────────────────── */
  window.showToast = function (message, type = 'info', duration = 3500) {
    let container = document.getElementById('toast-container');
    if (!container) {
      container = document.createElement('div');
      container.id = 'toast-container';
      document.body.appendChild(container);
    }

    const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `<span>${icons[type] || 'ℹ️'}</span><span>${message}</span>`;
    container.appendChild(toast);

    setTimeout(() => {
      toast.classList.add('hide');
      toast.addEventListener('animationend', () => toast.remove(), { once: true });
    }, duration);
  };

  // Native alert() ni override qilish (PIN lock ekranida hech narsa buzilmaydi)
  const _nativeAlert = window.alert.bind(window);
  window.alert = function (msg) {
    if (typeof msg !== 'string') msg = String(msg);
    const lower = msg.toLowerCase();

    // Tur aniqlash
    let type = 'info';
    if (lower.includes('✅') || lower.includes('muvaffaqiyat') || lower.includes('успешно') || lower.includes('saqlandi')) type = 'success';
    else if (lower.includes('❌') || lower.includes('xato') || lower.includes('ошибка') || lower.includes('error') || lower.includes('xatolik')) type = 'error';
    else if (lower.includes('⚠️') || lower.includes('ogohlantirish') || lower.includes('внимание') || lower.includes('warning')) type = 'warning';

    showToast(msg, type);
  };

  /* ─────────────────────────────────────────────
     6. CARD APPEAR (Intersection Observer)
  ─────────────────────────────────────────────── */
  function setupCardAppear() {
    if (!animEnabled) return;

    const selector = '.card, .test-card, .user-card, .payment-item, .test-item, .question-block, .session-item, .bubble, .rank-item';

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          // Stagger effekti
          setTimeout(() => {
            entry.target.classList.add('visible');
          }, Math.min(i * 55, 400));
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });

    document.querySelectorAll(selector).forEach(el => {
      el.classList.add('anim-card');
      observer.observe(el);
    });
  }

  /* ─────────────────────────────────────────────
     7. NAVBAR SCROLL HIDE/SHOW
  ─────────────────────────────────────────────── */
  function setupNavbarScroll() {
    const nav = document.querySelector('nav');
    if (!nav || !animEnabled) return;

    let lastY = window.scrollY;
    let ticking = false;

    window.addEventListener('scroll', () => {
      if (!ticking) {
        requestAnimationFrame(() => {
          const currentY = window.scrollY;
          if (currentY > lastY && currentY > 80) {
            nav.classList.add('nav-hidden');
          } else {
            nav.classList.remove('nav-hidden');
          }
          lastY = currentY;
          ticking = false;
        });
        ticking = true;
      }
    }, { passive: true });
  }

  /* ─────────────────────────────────────────────
     8. QUESTION CARD SLIDE (solve_test.html)
  ─────────────────────────────────────────────── */
  window.animateQuestionSlide = function (direction, callback) {
    if (!animEnabled) { callback(); return; }
    const card = document.getElementById('questionCard');
    if (!card) { callback(); return; }

    card.classList.add('slide-out');
    setTimeout(() => {
      card.classList.remove('slide-out');
      callback();
      card.classList.add('slide-in');
      setTimeout(() => card.classList.remove('slide-in'), 320);
    }, 210);
  };

  /* ─────────────────────────────────────────────
     9. COUNT-UP ANIMATION (natija ekrani)
  ─────────────────────────────────────────────── */
  window.animateCountUp = function (el, target, duration = 900) {
    if (!animEnabled || !el) { el && (el.textContent = target); return; }
    const start = 0;
    const step = (timestamp) => {
      if (!startTime) startTime = timestamp;
      const progress = Math.min((timestamp - startTime) / duration, 1);
      el.textContent = Math.round(progress * target);
      if (progress < 1) requestAnimationFrame(step);
    };
    let startTime = null;
    requestAnimationFrame(step);
  };

  /* ─────────────────────────────────────────────
     10. SETTINGS TOGGLE BUTTON (performance)
  ─────────────────────────────────────────────── */
  window.toggleAnimations = function () {
    animEnabled = !animEnabled;
    localStorage.setItem(PERF_KEY, animEnabled ? '1' : '0');
    applyPerfMode();
    showToast(
      animEnabled ? '✨ Animatsiyalar yoqildi' : '⚡ Animatsiyalar o\'chirildi (tezlashtirildi)',
      animEnabled ? 'success' : 'info'
    );
  };

  /* ─────────────────────────────────────────────
     INIT — DOMContentLoaded yoki darhol
  ─────────────────────────────────────────────── */
  function init() {
    injectStyles();
    detectPerformance();

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        setupPageTransitions();
        setupRipple();
        setupCardAppear();
        setupNavbarScroll();
      });
    } else {
      setupPageTransitions();
      setupRipple();
      setupCardAppear();
      setupNavbarScroll();
    }
  }

  init();

})();
</script>
