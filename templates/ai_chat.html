<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>
    {% if lang == 'uz' %}Testchi AI | Professional
    {% elif lang == 'uz_cyrl' %}Тестчи АИ | Профессионал
    {% else %}Testchi AI | Профессионал{% endif %}
  </title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #131314; 
      --card: rgba(30, 31, 34, 0.7); 
      --text: #e3e3e3;
      --muted: #9aa0a6; 
      --accent: #10a37f; 
      --accent-hover: #1a7f64;
      --sidebar-bg: #171717; 
      --border: rgba(255, 255, 255, 0.08);
      font-family: 'Inter', system-ui, sans-serif;
    }
    
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; color: var(--text); background: var(--bg); overflow: hidden; letter-spacing: 0.2px;}

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    .sidebar { width: 280px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100;}
    .sidebar-header { padding: 20px; display: flex; align-items: center; justify-content: space-between; gap: 10px;}
    
    .new-chat-btn { flex: 1; padding: 12px 16px; background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 12px; font-weight: 500; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: flex-start; gap: 12px; transition: all 0.2s ease;}
    .new-chat-btn:hover { background: rgba(255,255,255,0.05); transform: translateY(-1px); }
    .new-chat-icon { background: var(--accent); border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; color: white; font-size: 16px; font-weight: bold;}

    .session-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 4px; list-style: none; margin: 0; }
    .session-item { padding: 12px 15px; border-radius: 10px; cursor: pointer; font-size: 14px; color: var(--muted); transition: 0.2s; display: flex; justify-content: space-between; align-items: center; gap: 8px;}
    .session-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .session-item.active { background: rgba(16, 163, 127, 0.1); color: var(--accent); font-weight: 500;}
    .session-title-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }

    .del-session-btn { opacity: 0; transition: 0.2s; cursor: pointer; font-size: 14px; padding: 4px;}
    .session-item:hover .del-session-btn { opacity: 0.7; }
    .del-session-btn:hover { opacity: 1 !important; color: #ff4a4a; }

    .back-btn { padding: 20px; text-align: center; border-top: 1px solid var(--border); display: block; color: var(--muted); text-decoration: none; font-size: 14px; transition: 0.2s;}
    .back-btn:hover { color: var(--text); background: rgba(255,255,255,0.02);}

    .main-chat { flex: 1; display: flex; flex-direction: column; position: relative; }
    
    .top-navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; position: absolute; top: 0; width: 100%; z-index: 10; background: linear-gradient(to bottom, var(--bg) 50%, transparent); }
    .menu-toggle { display: none; background: transparent; border: none; color: var(--text); font-size: 24px; cursor: pointer; padding: 0;}
    
    .lang-btns { display: flex; gap: 8px; background: rgba(255,255,255,0.05); padding: 5px; border-radius: 12px; backdrop-filter: blur(10px); border: 1px solid var(--border);}
    .lang-btn { background: none; border: none; color: var(--text); font-size: 16px; cursor: pointer; padding: 5px; border-radius: 8px; opacity: 0.5; transition: 0.2s;}
    .lang-btn.active { opacity: 1; background: rgba(255,255,255,0.1); }
    .lang-btn:hover:not(.active) { opacity: 0.8; }

    .chat-container { flex: 1; padding: 80px 20px 20px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 30px; max-width: 900px; margin: 0 auto; width: 100%; scroll-behavior: smooth;}

    .message-wrapper { display: flex; width: 100%; gap: 15px; }
    .wrap-user { justify-content: flex-end; }
    .msg-user { background: rgba(255,255,255,0.08); padding: 14px 20px; border-radius: 20px 20px 4px 20px; font-size: 15px; line-height: 1.6; max-width: 75%; }
    
    .wrap-bot { justify-content: flex-start; }
    .bot-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; box-shadow: 0 0 15px rgba(16, 163, 127, 0.3);}
    .msg-bot { padding: 5px 0; font-size: 15px; line-height: 1.7; max-width: 85%; color: #d1d5db; }
    .msg-bot b, .msg-bot strong { color: #fff; }

    .actions { font-size: 12px; margin-top: 8px; display: flex; gap: 15px; opacity: 0; transition: 0.3s; justify-content: flex-end;}
    .wrap-user:hover .actions { opacity: 0.6; }
    .actions span { cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 4px;}
    .actions span:hover { color: #fff; opacity: 1;}

    .input-area { padding: 20px; background: linear-gradient(to top, var(--bg) 70%, transparent); display: flex; justify-content: center; }
    .input-box { max-width: 850px; width: 100%; display: flex; gap: 12px; align-items: flex-end; background: #2f2f2f; border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 8px 12px 8px 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); transition: 0.3s;}
    .input-box:focus-within { border-color: rgba(255,255,255,0.3); background: #333333; }
    
    textarea { flex: 1; background: transparent; border: none; padding: 10px 0; color: #fff; font-size: 15px; resize: none; outline: none; max-height: 200px; font-family: inherit; line-height: 1.5;}
    textarea::placeholder { color: #8e8e8e; }
    
    .send-btn { background: var(--text); color: var(--bg); border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; font-size: 18px;}
    .send-btn:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(255,255,255,0.2); }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none;}

    /* Gemini Thinking */
    .gemini-thinking-wrapper { display: flex; gap: 12px; width: 100%; align-items: center; padding: 10px 0; animation: fadeIn 0.4s ease; }
    .gemini-icon-container { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0; }
    .gemini-star { width: 18px; height: 18px; animation: pulse-glow 1.2s infinite alternate; }
    .gemini-spinner { position: absolute; width: 28px; height: 28px; border: 2px solid rgba(123, 163, 255, 0.15); border-top-color: #7ba3ff; border-radius: 50%; animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .gemini-thinking-text-container { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); padding: 8px 16px; border-radius: 20px; cursor: default; }
    .gemini-thinking-text { color: #e3e3e3; font-size: 14.5px; font-weight: 500; animation: fadeInOut 0.5s ease; }
    .chevron-down { color: #9aa0a6; width: 14px; height: 14px;}

    @keyframes pulse-glow { 0% { transform: scale(0.9); filter: drop-shadow(0 0 2px rgba(123, 163, 255, 0.4)); opacity: 0.7;} 100% { transform: scale(1.1); filter: drop-shadow(0 0 8px rgba(123, 163, 255, 0.9)); opacity: 1;} }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInOut { 0% {opacity: 0.5; transform: scale(0.98);} 100% {opacity: 1; transform: scale(1);} }
    .cursor-blink { display: inline-block; width: 6px; height: 15px; background-color: var(--text); margin-left: 2px; animation: blink 1s step-end infinite; vertical-align: middle;}
    @keyframes blink { 50% { opacity: 0; } }

    /* ── KOD BLOKI ── */
    .code-block {
      position: relative;
      margin: 12px 0;
      border-radius: 10px;
      background: #1e1e2e;
      border: 1px solid rgba(255,255,255,0.1);
      overflow: hidden;
      font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace;
    }
    .code-block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-size: 12px;
      color: #9aa0a6;
    }
    .code-block-lang {
      font-weight: 600;
      color: #7ba3ff;
      text-transform: lowercase;
      letter-spacing: 0.5px;
    }
    .code-copy-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      color: #9aa0a6;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.18s, color 0.18s;
      font-family: inherit;
    }
    .code-copy-btn:hover { background: rgba(255,255,255,0.14); color: #fff; }
    .code-copy-btn.copied { background: rgba(56,211,159,0.18); color: #38d39f; border-color: rgba(56,211,159,0.35); }
    .code-block pre {
      margin: 0;
      padding: 16px;
      overflow-x: auto;
      font-size: 13.5px;
      line-height: 1.65;
      color: #e2e8f0;
      white-space: pre;
    }
    .code-block code { font-family: inherit; }

    /* scrollbar kod bloki uchun */
    .code-block pre::-webkit-scrollbar { height: 5px; }
    .code-block pre::-webkit-scrollbar-track { background: transparent; }
    .code-block pre::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }

    /* inline kod */
    .msg-bot code:not(.block-code),
    .msg-user code:not(.block-code) {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 4px;
      padding: 1px 6px;
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 13px;
      color: #f6b8ff;
    }

    @media (max-width: 768px) {
      .sidebar { position: absolute; height: 100%; transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); box-shadow: 10px 0 30px rgba(0,0,0,0.8); }
      .menu-toggle { display: block; }
      .chat-container { padding-top: 70px; }
      .msg-user { max-width: 90%; }
      .msg-bot { max-width: 95%; }
    }
  </style>
</head>
<body style="{% if current_user_bg %}background: linear-gradient(rgba(19, 19, 20, 0.85), rgba(19, 19, 20, 0.95)), url('{{ current_user_bg }}') no-repeat center center fixed; background-size: cover;{% endif %}">

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" onclick="startNewChat()">
        <div class="new-chat-icon">+</div>
        {% if lang == 'uz' %}Yangi Chat{% elif lang == 'uz_cyrl' %}Янги Чат{% else %}Новый чат{% endif %}
      </button>
    </div>
    <ul class="session-list" id="sessionList"></ul>
    <a href="/?token={{ token }}" class="back-btn">⬅️ {% if lang == 'uz' %}Kabinetga qaytish{% elif lang == 'uz_cyrl' %}Кабинетга қайтиш{% else %}Вернуться в кабинет{% endif %}</a>
  </div>

  <div class="main-chat">
    <div class="top-navbar">
      <div style="display: flex; align-items: center; gap: 15px;">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <span style="font-weight: 600; color: #fff; font-size: 16px; display: flex; align-items: center; gap: 8px;">
          <span style="color: var(--accent);">✦</span> Testchi AI
        </span>
      </div>
      <div class="lang-btns">
        <form action="/set-lang" method="POST" style="margin: 0;">
            <input type="hidden" name="token" value="{{ token }}">
            <input type="hidden" name="lang" value="uz">
            <button type="submit" class="lang-btn {% if lang == 'uz' %}active{% endif %}" title="O'zbek tili">🇺🇿</button>
        </form>
        <form action="/set-lang" method="POST" style="margin: 0;">
            <input type="hidden" name="token" value="{{ token }}">
            <input type="hidden" name="lang" value="uz_cyrl">
            <button type="submit" class="lang-btn {% if lang == 'uz_cyrl' %}active{% endif %}" title="Ўзбек тили">Кр</button>
        </form>
        <form action="/set-lang" method="POST" style="margin: 0;">
            <input type="hidden" name="token" value="{{ token }}">
            <input type="hidden" name="lang" value="ru">
            <button type="submit" class="lang-btn {% if lang == 'ru' %}active{% endif %}" title="Русский язык">🇷🇺</button>
        </form>
      </div>
    </div>

    <div class="chat-container" id="chatBox"></div>

    <div class="input-area">
      <div class="input-box">
        <textarea id="userInput" rows="1" placeholder="{% if lang == 'uz' %}AI ga xabar yozing...{% elif lang == 'uz_cyrl' %}АИ га хабар ёзинг...{% else %}Напишите сообщение AI...{% endif %}" oninput="autoResize(this)" onkeypress="handleEnter(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
      </div>
    </div>
  </div>

  <script>
    /* ════════════════════════════════════════════════════
       MARKDOWN RENDERER — kod bloki + inline formatting
    ════════════════════════════════════════════════════ */

    // Tilni chiroyli ko'rsatish uchun
    const LANG_LABELS = {
      python: 'Python', py: 'Python',
      javascript: 'JavaScript', js: 'JavaScript',
      typescript: 'TypeScript', ts: 'TypeScript',
      html: 'HTML', css: 'CSS',
      sql: 'SQL', json: 'JSON', yaml: 'YAML', yml: 'YAML',
      bash: 'Bash', sh: 'Shell', shell: 'Shell',
      c: 'C', cpp: 'C++', java: 'Java', kotlin: 'Kotlin',
      swift: 'Swift', go: 'Go', rust: 'Rust', php: 'PHP',
      ruby: 'Ruby', dart: 'Dart', r: 'R', matlab: 'MATLAB',
      xml: 'XML', markdown: 'Markdown', md: 'Markdown',
      text: 'Text', txt: 'Text', plaintext: 'Text', '': 'Code',
    };

    function getLangLabel(lang) {
      return LANG_LABELS[(lang || '').toLowerCase()] || lang || 'Code';
    }

    // Kod blokini HTML ga aylantirish
    function renderCodeBlock(lang, code) {
      const label = getLangLabel(lang);
      // HTML escape
      const safe = code
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      return `
        <div class="code-block">
          <div class="code-block-header">
            <span class="code-block-lang">${label}</span>
            <button class="code-copy-btn" onclick="copyCode(this)">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
              Nusxalash
            </button>
          </div>
          <pre><code class="block-code">${safe}</code></pre>
        </div>`;
    }

    // Inline markdown (bold, italic, inline code)
    function renderInlineMarkdown(text) {
      // HTML escape
      let t = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      // Sarlavhalar (# → <h1> ... ###### → <h6>)
      t = t
        .replace(/^######\s+(.+)$/gm, '<h6 style="margin:6px 0 2px;font-size:12px;color:#aaa;font-weight:600;">$1</h6>')
        .replace(/^#####\s+(.+)$/gm,  '<h5 style="margin:8px 0 3px;font-size:13px;color:#ccc;font-weight:600;">$1</h5>')
        .replace(/^####\s+(.+)$/gm,   '<h4 style="margin:10px 0 4px;font-size:14px;color:#ddd;font-weight:700;">$1</h4>')
        .replace(/^###\s+(.+)$/gm,    '<h3 style="margin:12px 0 5px;font-size:15px;color:#fff;font-weight:700;padding-bottom:3px;border-bottom:1px solid rgba(255,255,255,0.1);">$1</h3>')
        .replace(/^##\s+(.+)$/gm,     '<h2 style="margin:14px 0 6px;font-size:17px;color:#fff;font-weight:700;">$1</h2>')
        .replace(/^#\s+(.+)$/gm,      '<h1 style="margin:16px 0 8px;font-size:19px;color:#fff;font-weight:800;">$1</h1>');
      // Bold, italic, inline code
      t = t
        .replace(/\*\*\*(.+?)\*\*\*/g, '<b><i>$1</i></b>')
        .replace(/\*\*(.+?)\*\*/g,     '<b>$1</b>')
        .replace(/\*(.+?)\*/g,         '<i>$1</i>')
        .replace(/_(.+?)_/g,           '<i>$1</i>')
        .replace(/`([^`]+)`/g,         '<code>$1</code>');
      // Ro'yxat (- yoki * bilan boshlanadigan qatorlar)
      t = t.replace(/^[-*]\s+(.+)$/gm, '<li style="margin:2px 0;margin-left:18px;list-style:disc;">$1</li>');
      // Raqamli ro'yxat
      t = t.replace(/^\d+\.\s+(.+)$/gm, '<li style="margin:2px 0;margin-left:18px;list-style:decimal;">$1</li>');
      // Yangi qator
      t = t.replace(/\n/g, '<br>');
      return t;
    }

    // Matni kod bloki va oddiy qismlarga ajratish
    function splitCodeBlocks(text) {
      const parts = [];
      const regex = /```(\w*)\n?([\s\S]*?)```/g;
      let lastIndex = 0;
      let match;
      while ((match = regex.exec(text)) !== null) {
        if (match.index > lastIndex) {
          parts.push({ isCode: false, text: text.slice(lastIndex, match.index) });
        }
        parts.push({ isCode: true, lang: match[1], code: match[2] });
        lastIndex = regex.lastIndex;
      }
      if (lastIndex < text.length) {
        parts.push({ isCode: false, text: text.slice(lastIndex) });
      }
      return parts;
    }

    // To'liq markdown render (bir vaqtda hammasi)
    function renderMarkdown(text) {
      const parts = splitCodeBlocks(text);
      return parts.map(p => {
        if (p.isCode) return renderCodeBlock(p.lang, p.code);
        return renderInlineMarkdown(p.text);
      }).join('');
    }

    // Copy tugmasi bosilganda
    function copyCode(btn) {
      const pre = btn.closest('.code-block').querySelector('pre');
      const code = pre.textContent;
      navigator.clipboard.writeText(code).then(() => {
        btn.classList.add('copied');
        btn.innerHTML = `
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          Nusxalandi!`;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = `
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            Nusxalash`;
        }, 2000);
      }).catch(() => {
        // Clipboard API ishlamasa — fallback
        const ta = document.createElement('textarea');
        ta.value = code;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        btn.classList.add('copied');
        btn.textContent = '✅ Nusxalandi!';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.textContent = 'Nusxalash';
        }, 2000);
      });
    }

    // Yangi render qilingan msgDiv dagi copy tugmalarini ulash
    function attachCopyBtns(container) {
      // onclick allaqachon HTML da — hech narsa kerak emas,
      // lekin SPA navigatsiyada kerak bo'lsa shu yerda
    }

    /* ════════════════════════════════════════════════════ */

    let currentSessionId = null;
    let isSending = false;
    let renderedMessages = new Set();
    
    const lang = "{{ lang }}";

    const t = {
        'delete_confirm': lang === 'uz' ? "Ushbu chatni o'chirib yubormoqchimisiz?" : (lang === 'uz_cyrl' ? "Ушбу чатни ўчириб юбормоқчимисиз?" : "Удалить этот чат?"),
        'welcome_title': "Qanday yordam bera olaman?",
        'welcome_title_cyrl': "Қандай ёрдам бера оламан?",
        'welcome_title_ru': "Чем могу помочь?",
        'edit': "✏️",
        'delete': "🗑️",
        'edit_prompt': lang === 'uz' ? "Tahrirlash:" : "Редактировать:"
    };

    const welcomeTitle = lang === 'uz' ? t.welcome_title : (lang === 'uz_cyrl' ? t.welcome_title_cyrl : t.welcome_title_ru);

    window.onload = async () => {
      await loadSessions();
      startNewChat();
    };

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
    function autoResize(el) { el.style.height = 'auto'; let newHeight = el.scrollHeight; if(newHeight > 200) newHeight = 200; el.style.height = newHeight + 'px'; if(el.value === '') el.style.height = '40px'; }

    async function loadSessions() {
      const res = await fetch('/api/ai-chat/sessions?token={{ token }}');
      const sessions = await res.json();
      const list = document.getElementById('sessionList');
      list.innerHTML = '';

      sessions.forEach(s => {
        const li = document.createElement('li');
        li.className = `session-item ${s.session_id === currentSessionId ? 'active' : ''}`;

        const titleSpan = document.createElement('div');
        titleSpan.className = 'session-title-text';
        let title = s.title.length > 20 ? s.title.substring(0, 20) + '...' : s.title;
        titleSpan.innerText = title;
        titleSpan.onclick = () => { loadHistory(s.session_id); if(window.innerWidth<=768) toggleSidebar(); };

        const delBtn = document.createElement('div');
        delBtn.className = 'del-session-btn';
        delBtn.innerHTML = '✖';
        delBtn.onclick = (e) => { e.stopPropagation(); deleteSession(s.session_id); };

        li.appendChild(titleSpan);
        li.appendChild(delBtn);
        list.appendChild(li);
      });
    }

    async function deleteSession(sessionId) {
      if(confirm(t.delete_confirm)) {
        await fetch('/api/ai-chat/edit', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ token: "{{ token }}", session_id: sessionId, action: "delete_session" })
        });
        if(currentSessionId === sessionId) startNewChat(); else loadSessions();
      }
    }

    function startNewChat() {
      currentSessionId = null;
      renderedMessages.clear(); // Xabarlar tarixini tozalash
      document.getElementById('chatBox').innerHTML = `<div style="text-align:center; margin-top:20vh; animation: fadeIn 0.5s ease;"><div style="font-size: 40px; margin-bottom: 15px; color: var(--accent);">✦</div><h2 style="font-size: 28px; font-weight: 500; color: #fff;">${welcomeTitle}</h2></div>`;
      document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
      if(window.innerWidth <= 768 && document.getElementById('sidebar').classList.contains('open')) toggleSidebar();
    }

    async function loadHistory(sessionId) {
      currentSessionId = sessionId;
      loadSessions();
      renderedMessages.clear(); // Boshqa chatga o'tganda ID larni tozalash

      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML = '';

      const res = await fetch(`/api/ai-chat/history?token={{ token }}&session_id=${sessionId}`);
      const msgs = await res.json();
      msgs.forEach(m => addMessageUI(m.id, m.content, m.role === 'user', false));
      scrollToBottom();
    }

    function addThinkingUI() {
      const chatBox = document.getElementById('chatBox');
      if(chatBox.innerHTML.includes(welcomeTitle)) chatBox.innerHTML = '';

      const wrap = document.createElement('div');
      wrap.id = 'thinkingIndicator';
      wrap.innerHTML = `
        <div class="gemini-thinking-wrapper wrap-bot">
          <div class="gemini-icon-container">
            <svg class="gemini-star" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill="#7ba3ff"/></svg>
            <div class="gemini-spinner"></div>
          </div>
          <div class="gemini-thinking-text-container">
            <span class="gemini-thinking-text" id="dynamicStatusText">💬 So'rovingiz qabul qilindi...</span>
            <svg class="chevron-down" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>
      `;
      chatBox.appendChild(wrap);
      scrollToBottom();
      // setInterval YO'Q — server o'zi real statuslarni yuboradi
    }

    function removeThinkingUI() {
      const indicator = document.getElementById('thinkingIndicator');
      if (indicator) indicator.remove();
      // thinkingInterval mavjud emas endi — server statuslari to'g'ridan-to'g'ri keladi
    }

    function addMessageUI(id, text, isUser, animate = false) {
      // MUHIM HIMOYA: Agar xabar IDsi avval chiqqan bo'lsa, ikkinchi marta chizmaydi!
      if (id) {
        if (renderedMessages.has(id)) return;
        renderedMessages.add(id);
      }

      const chatBox = document.getElementById('chatBox');
      if(chatBox.innerHTML.includes(welcomeTitle)) chatBox.innerHTML = '';

      const wrap = document.createElement('div');
      wrap.className = `message-wrapper ${isUser ? 'wrap-user' : 'wrap-bot'}`;
      if(id) wrap.id = `msg_${id}`;

      if (!isUser) {
        const avatar = document.createElement('div');
        avatar.className = 'bot-avatar';
        avatar.innerHTML = '✦';
        wrap.appendChild(avatar);
      }

      const msgContainer = document.createElement('div');
      msgContainer.style.display = 'flex';
      msgContainer.style.flexDirection = 'column';
      msgContainer.style.maxWidth = '100%';

      const msgDiv = document.createElement('div');
      msgDiv.className = `msg-${isUser ? 'user' : 'bot'}`;
      msgContainer.appendChild(msgDiv);

      if(isUser && id) {
        const actions = document.createElement('div');
        actions.className = 'actions';
        actions.innerHTML = `<span onclick="editMsg(${id}, '${text.replace(/'/g, "\\'")}')">${t.edit}</span>
                             <span style="color:#ff6b6b;" onclick="deleteMsg(${id})">${t.delete}</span>`;
        msgContainer.appendChild(actions);
      }

      wrap.appendChild(msgContainer);
      chatBox.appendChild(wrap);

      let formattedText = renderMarkdown(text);

      if (animate && !isUser) {
        // Animate qilishdan oldin kod bloklarini ajratamiz
        // Typewriter faqat oddiy matn uchun, kod bloklari darhol ko'rinadi
        const parts = splitCodeBlocks(text);
        let partIdx = 0;
        let currentHTML = "";
        msgDiv.innerHTML = '<span class="cursor-blink"></span>';

        function typeParts() {
          if (partIdx >= parts.length) {
            msgDiv.innerHTML = renderMarkdown(text);
            attachCopyBtns(msgDiv);
            scrollToBottom();
            return;
          }
          const part = parts[partIdx];
          partIdx++;

          if (part.isCode) {
            // Kod bloki — darhol qo'shiladi
            currentHTML += renderCodeBlock(part.lang, part.code);
            msgDiv.innerHTML = currentHTML + '<span class="cursor-blink"></span>';
            attachCopyBtns(msgDiv);
            scrollToBottom();
            typeParts();
          } else {
            // Oddiy matn — typewriter
            const tokens = renderInlineMarkdown(part.text)
              .match(/(<[^>]+>|&[a-zA-Z0-9#]+;|[\s\S])/g) || [];
            let i = 0;
            function typeToken() {
              if (i < tokens.length) {
                currentHTML += tokens[i];
                msgDiv.innerHTML = currentHTML + '<span class="cursor-blink"></span>';
                i++;
                scrollToBottom();
                setTimeout(typeToken, 8);
              } else {
                typeParts();
              }
            }
            typeToken();
          }
        }
        typeParts();
      } else {
        msgDiv.innerHTML = formattedText;
        attachCopyBtns(msgDiv);
        scrollToBottom();
      }
    }

    async function sendMessage() {
      // Blokirovka: Agar oldingi xabar ketayotgan bo'lsa, qotib qolishni oldini oladi
      if (isSending) return; 

      const input = document.getElementById('userInput');
      const btn = document.getElementById('sendBtn');
      if (btn.disabled) return; 

      const text = input.value.trim();
      if (!text) return;

      isSending = true; // Jarayon boshlandi
      input.value = '';
      input.style.height = '40px';
      btn.disabled = true;

      addMessageUI(null, text, true, false);
      addThinkingUI();

      try {
        const response = await fetch('/api/ai-chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: "{{ token }}", text: text, session_id: currentSessionId })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop(); 

          for (let line of lines) {
            if (!line.trim()) continue;
            try {
              const data = JSON.parse(line);

              if (data.status) {
                const statusEl = document.getElementById('dynamicStatusText');
                if (statusEl) {
                  // Eski matnni fade-out, yangi matnni fade-in
                  statusEl.style.transition = 'opacity 0.15s ease, transform 0.15s ease';
                  statusEl.style.opacity = '0';
                  statusEl.style.transform = 'translateY(-4px)';
                  setTimeout(() => {
                    statusEl.innerText = data.status;
                    statusEl.style.transform = 'translateY(4px)';
                    requestAnimationFrame(() => {
                      statusEl.style.opacity = '1';
                      statusEl.style.transform = 'translateY(0)';
                    });
                  }, 150);
                }
              } else if (data.reply) {
                removeThinkingUI();
                btn.disabled = false;
                isSending = false; // Jarayon tugadi
                currentSessionId = data.session_id;
                addMessageUI(data.id, data.reply, false, true); 
                loadSessions();
              } else if (data.error) {
                removeThinkingUI();
                btn.disabled = false;
                isSending = false;
                addMessageUI(null, `❌ <b>Xatolik:</b><br>${data.error}`, false, false);
              }
            } catch (e) {
              console.error("Kichik json tahlil xatosi:", e);
            }
          }
        }
      } catch (err) {
        removeThinkingUI();
        btn.disabled = false;
        isSending = false;
        addMessageUI(null, `❌ Tarmoq xatosi. Iltimos qayta urinib ko'ring.`, false);
      }
      input.focus();
    }

    function handleEnter(e) { 
      if (e.key === 'Enter' && !e.shiftKey) { 
        e.preventDefault(); 
        e.stopPropagation();
        sendMessage(); 
      } 
    }
    function scrollToBottom() { const b = document.getElementById('chatBox'); b.scrollTop = b.scrollHeight; }

    // ✏️ Xabarni tahrirlash
    async function editMsg(msgId, oldText) {
      const newText = prompt(t.edit_prompt, oldText);
      if (!newText || newText.trim() === '' || newText.trim() === oldText) return;

      const res = await fetch('/api/ai-chat/edit', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          token: "{{ token }}",
          session_id: currentSessionId,
          message_id: msgId,
          action: 'edit',
          new_text: newText.trim()
        })
      });
      const data = await res.json();
      if (data.success) {
        // Tahrirlangan xabarni yangilaymiz
        const msgEl = document.querySelector(`#msg_${msgId} .msg-user`);
        if (msgEl) msgEl.innerHTML = newText.replace(/\n/g,'<br>');
        // Bot javobini ham yangilaymiz
        if (data.reply) {
          // Eski bot javobini topib o'chirish
          const allMessages = document.querySelectorAll('.message-wrapper.wrap-bot');
          allMessages.forEach(el => {
            const siblingUser = el.previousElementSibling;
            if (siblingUser && siblingUser.id === `msg_${msgId}`) el.remove();
          });
          addMessageUI(data.id, data.reply, false, true);
          loadSessions();
        }
      } else {
        showToast('❌ ' + (data.error || 'Tahrirlashda xatolik'), 'error');
      }
    }

    // 🗑️ Xabarni o'chirish
    async function deleteMsg(msgId) {
      const confirmText = lang === 'uz' ? "Bu xabarni o'chirishni tasdiqlaysizmi?" :
                         (lang === 'uz_cyrl' ? "Бу хабарни ўчиришни тасдиқлайсизми?" :
                          "Удалить это сообщение?");
      if (!confirm(confirmText)) return;

      const res = await fetch('/api/ai-chat/edit', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          token: "{{ token }}",
          session_id: currentSessionId,
          message_id: msgId,
          action: 'delete'
        })
      });
      const data = await res.json();
      if (data.success) {
        const msgEl = document.getElementById(`msg_${msgId}`);
        if (msgEl) {
          msgEl.style.opacity = '0';
          msgEl.style.transform = 'translateX(30px)';
          msgEl.style.transition = '0.3s ease';
          setTimeout(() => msgEl.remove(), 300);
        }
      } else {
        showToast('❌ ' + (data.error || "O'chirishda xatolik"), 'error');
      }
    }
  </script>

<script>
/* TESTCHI ANIMATIONS v2.0 */
(function(){
'use strict';

/* ── 1. PERFORMANCE DETECTION ── */
var PERF_KEY='testchi_perf';
var animEnabled=true;

function detectPerformance(){
  var saved=localStorage.getItem(PERF_KEY);
  if(saved!==null){animEnabled=(saved==='1');applyPerfMode();return;}
  var cores=navigator.hardwareConcurrency||2;
  var mem=navigator.deviceMemory||4;
  if(cores<=2||mem<=2){animEnabled=false;localStorage.setItem(PERF_KEY,'0');applyPerfMode();return;}
  var frames=0,start=performance.now();
  function count(){frames++;
    if(performance.now()-start<300){requestAnimationFrame(count);}
    else{var fps=Math.round(frames/0.3);animEnabled=fps>=30;
      localStorage.setItem(PERF_KEY,animEnabled?'1':'0');applyPerfMode();}}
  requestAnimationFrame(count);
  applyPerfMode();
}
function applyPerfMode(){
  if(!animEnabled)document.documentElement.classList.add('no-anim');
  else document.documentElement.classList.remove('no-anim');
}

/* ── 2. INLINE CSS ── */

  ].join('');
  document.head.appendChild(s);
}

/* ── 3. PAGE TRANSITION ── */
function setupPageTransition(){
  if(!animEnabled)return;
  var ov=document.getElementById('_pg_overlay');
  if(!ov){ov=document.createElement('div');ov.id='_pg_overlay';
    ov.innerHTML='<span>🎓</span>';document.body.appendChild(ov);}
  document.addEventListener('click',function(e){
    var a=e.target.closest('a');if(!a)return;
    var h=a.getAttribute('href');if(!h)return;
    if(h.startsWith('http')||h.startsWith('#')||h.startsWith('javascript')||
       h.startsWith('mailto')||a.target==='_blank'||e.ctrlKey||e.metaKey||e.shiftKey)return;
    if(a.closest('form'))return;
    e.preventDefault();ov.classList.add('on');
    setTimeout(function(){window.location.href=h;},280);
  });
}

/* ── 4. RIPPLE ── */
function setupRipple(){
  var SEL='a,button,.btn,.test-card,.key,.option-label,.star-option,.tab,.session-item,.list>li,.user-card,.new-chat-btn';
  document.addEventListener('pointerdown',function(e){
    var el=e.target.closest(SEL);if(!el||!animEnabled)return;
    el.classList.add('ripple-host');
    var r=el.getBoundingClientRect(),sz=Math.max(r.width,r.height)*2;
    var w=document.createElement('span');w.className='_rwave';
    w.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+(e.clientX-r.left-sz/2)+'px;top:'+(e.clientY-r.top-sz/2)+'px';
    el.appendChild(w);w.addEventListener('animationend',function(){w.remove();},{once:true});
  });
}

/* ── 5. TOAST ── */
window.showToast=function(msg,type,dur){
  type=type||'info';dur=dur||3500;
  var box=document.getElementById('_toast_box');
  if(!box){box=document.createElement('div');box.id='_toast_box';document.body.appendChild(box);}
  var icons={success:'✅',error:'❌',info:'ℹ️',warning:'⚠️'};
  var t=document.createElement('div');t.className='_toast '+type;
  t.innerHTML='<span>'+(icons[type]||'ℹ️')+'</span><span>'+msg+'</span>';
  box.appendChild(t);
  setTimeout(function(){t.classList.add('hide');t.addEventListener('animationend',function(){t.remove();},{once:true});},dur);
};
var _na=window.alert.bind(window);
window.alert=function(msg){
  if(typeof msg!=='string')msg=String(msg);
  var l=msg.toLowerCase();
  var type='info';
  if(l.includes('✅')||l.includes('muvaffaqiyat')||l.includes('успешно')||l.includes('saqlandi'))type='success';
  else if(l.includes('❌')||l.includes('xato')||l.includes('ошибка')||l.includes('error'))type='error';
  else if(l.includes('⚠️')||l.includes('ogohlantirish')||l.includes('внимание')||l.includes('warning'))type='warning';
  showToast(msg,type);
};

/* ── 6. CARD APPEAR ── */
function setupCardAppear(){
  if(!animEnabled)return;
  var sel='.card,.test-card,.user-card,.payment-item,.test-item,.question-block,.session-item,.bubble,.rank-item';
  var obs=new IntersectionObserver(function(entries){
    entries.forEach(function(en,i){
      if(en.isIntersecting){
        setTimeout(function(){en.target.classList.add('visible');},Math.min(i*55,400));
        obs.unobserve(en.target);
      }
    });
  },{threshold:.08,rootMargin:'0px 0px -30px 0px'});
  document.querySelectorAll(sel).forEach(function(el){el.classList.add('anim-card');obs.observe(el);});
}

/* ── 7. NAVBAR SCROLL HIDE ── */
function setupNavScroll(){
  var nav=document.querySelector('nav');if(!nav||!animEnabled)return;
  var lastY=window.scrollY,ticking=false;
  window.addEventListener('scroll',function(){
    if(!ticking){requestAnimationFrame(function(){
      var cy=window.scrollY;
      if(cy>lastY&&cy>80)nav.classList.add('nav-hidden');
      else nav.classList.remove('nav-hidden');
      lastY=cy;ticking=false;
    });ticking=true;}
  },{passive:true});
}

/* ── 8. SOLVE_TEST: SLIDE ── */
window.animateQuestionSlide=function(dir,cb){
  if(!animEnabled){cb();return;}
  var card=document.getElementById('questionCard');if(!card){cb();return;}
  card.classList.add('slide-out');
  setTimeout(function(){
    card.classList.remove('slide-out');cb();
    card.classList.add('slide-in');
    setTimeout(function(){card.classList.remove('slide-in');},320);
  },210);
};

/* ── 9. COUNTUP ── */
window.animateCountUp=function(el,target,dur){
  dur=dur||900;if(!animEnabled||!el){if(el)el.textContent=target;return;}
  var st=null;
  function step(ts){
    if(!st)st=ts;
    var p=Math.min((ts-st)/dur,1);
    el.textContent=Math.round(p*target);
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
};

/* ── 10. TOGGLE ── */
window.toggleAnimations=function(){
  animEnabled=!animEnabled;
  localStorage.setItem(PERF_KEY,animEnabled?'1':'0');
  applyPerfMode();
  showToast(animEnabled?'✨ Animatsiyalar yoqildi':'⚡ Animatsiyalar o\'chirildi',animEnabled?'success':'info');
};

/* ── INIT ── */
function init(){
  injectStyles();
  detectPerformance();
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',function(){
      setupPageTransition();setupRipple();setupCardAppear();setupNavScroll();
    });
  } else {
