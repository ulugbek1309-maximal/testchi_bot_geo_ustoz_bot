<!DOCTYPE html>
<html>
<head>
    <title>Testchi</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js?v=8"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #0f172a 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            text-align: center;
        }
        .wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 24px;
        }
        .logo {
            font-size: 52px;
            animation: logoPulse 2s ease-in-out infinite alternate;
        }
        @keyframes logoPulse {
            from { transform: scale(0.95); }
            to   { transform: scale(1.05); }
        }
        .loader {
            width: 44px; height: 44px;
            border: 3px solid rgba(56, 211, 159, 0.2);
            border-top-color: #38d39f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #msg {
            font-size: 17px;
            font-weight: 500;
            color: #e2e8f0;
            min-height: 28px;
        }
        #debug {
            font-size: 13px;
            color: #64748b;
            max-width: 280px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="logo">🎓</div>
        <div class="loader" id="spinner"></div>
        <h2 id="msg">Yuklanmoqda...</h2>
        <p id="debug"></p>
    </div>
    <script>
        function initWebApp() {
            try {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                let initData = tg.initData;
                if (!initData && window.location.hash) {
                    initData = new URLSearchParams(window.location.hash.slice(1)).get('tgWebAppData');
                }
                if (!initData) {
                    document.getElementById('spinner').style.display = 'none';
                    document.getElementById('msg').innerHTML = "❌ WebApp xatosi!";
                    document.getElementById('debug').innerHTML = "Iltimos, bot orqali <b>/start</b> bosing.";
                    return;
                }
                fetch('/api/auth/webapp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: initData })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.needs_captcha) {
                        window.location.replace('/captcha');
                    } else if (data.needs_sub) {
                        window.location.replace('/force-sub?token=' + data.token);
                    } else if (data.token) {
                        window.location.replace('/pin-lock?token=' + data.token);
                    } else {
                        document.getElementById('spinner').style.display = 'none';
                        document.getElementById('msg').innerHTML = "Kirish rad etildi 🛑";
                        document.getElementById('debug').innerHTML = data.error || "Ruxsat yo'q.";
                    }
                })
                .catch(err => {
                    document.getElementById('spinner').style.display = 'none';
                    document.getElementById('msg').innerHTML = "Server xatosi! ❌";
                    document.getElementById('debug').innerHTML = "Internetni tekshiring yoki sahifani yangilang.";
                });
            } catch (e) {
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('msg').innerHTML = "Xatolik ❌";
                document.getElementById('debug').innerHTML = e.message;
            }
        }
        setTimeout(initWebApp, 300);
    </script>
<script src="/animations.js"></script>
</body>
</html>
